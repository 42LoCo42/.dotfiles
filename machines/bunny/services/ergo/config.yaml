network:
  name: "ZHS"

server:
  name: "eleonora.gay"

  listeners:
    ":6697":
      tls:
        cert: /data/ergo.crt
        key: /data/ergo.key
      min-tls-version: 1.2

    ":8080":
      websocket: true

  casemapping: "precis"
  enforce-utf8: true

  lookup-hostnames: false
  check-ident: false
  coerce-ident: "~u"

  idle-timeouts:
    registration: 60s
    ping: 1m30s
    disconnect: 2m30s

  relaymsg:
    enabled: true
    separators: "/"
    available-to-chanops: true

  max-sendq: 96k

  compatibility:
    force-trailing: true
    send-unprefixed-sasl: true
    allow-truncation: false

  ip-limits:
    count: true
    max-concurrent-connections: 16

    throttle: true
    window: 10m
    max-connections-per-window: 32

    cidr-len-ipv4: 32
    cidr-len-ipv6: 64

  ip-cloaking:
    enabled: true
    enabled-for-always-on: true
    netname: "irc"

    cidr-len-ipv4: 32
    cidr-len-ipv6: 64
    num-bits: 64

  oper-throttle: 10s

  output-path: "/data/dump"

accounts:
  authentication-enabled: true
  registration:
    enabled: false
    allow-before-connect: true

    throttling:
      enabled: true
      duration: 10m
      max-attempts: 30

    bcrypt-cost: 4
    verify-timeout: "32h"

  login-throttling:
    enabled: true
    duration: 1m
    max-attempts: 3

  login-via-pass-command: true
  advertise-scram: true

  require-sasl:
    enabled: true
    exempted:
      - 'localhost'

  nick-reservation:
    enabled: true
    additional-nick-limit: 0
    method: strict
    allow-custom-enforcement: false
    force-nick-equals-account: true
    forbid-anonymous-nick-changes: true

  multiclient:
    enabled: true
    allowed-by-default: true
    always-on: "opt-in"
    auto-away: "opt-in"

  vhosts:
    enabled: true
    max-length: 64
    valid-regexp: '^[0-9A-Za-z.\-_/]+$'

  default-user-modes: +i

channels:
  # modes that are set when new channels are created
  # +n is no-external-messages
  # +t is op-only-topic,
  # +C is no CTCPs (besides ACTION)
  # see  /QUOTE HELP cmodes  for more channel modes
  default-modes: +ntC
  max-channels-per-client: 100
  operator-only-creation: false

  registration:
    enabled: true
    operator-only: false
    max-channels-per-account: 15

  invite-expiration: 24h

oper-classes:
  "chat-moderator":
    title: Chat Moderator

    capabilities:
      - "kill" # disconnect user sessions
      - "ban" # ban IPs, CIDRs, NUH masks, and suspend accounts (UBAN / DLINE / KLINE)
      - "nofakelag" # exempted from "fakelag" restrictions on rate of message sending
      - "relaymsg" # use RELAYMSG in any channel (see the `relaymsg` config block)
      - "vhosts" # add and remove vhosts from users
      - "sajoin" # join arbitrary channels, including private channels
      - "samode" # modify arbitrary channel and user modes
      - "snomasks" # subscribe to arbitrary server notice masks
      - "roleplay" # use the (deprecated) roleplay commands in any channel

  "server-admin":
    title: Server Admin
    extends: "chat-moderator"

    capabilities:
      - "rehash" # rehash the server, i.e. reload the config at runtime
      - "accreg" # modify arbitrary account registrations
      - "chanreg" # modify arbitrary channel registrations
      - "history" # modify or delete history messages
      - "defcon" # use the DEFCON command (restrict server capabilities)
      - "massmessage" # message all users on the server
      - "metadata" # modify arbitrary metadata on channels and users

opers:
  admin:
    class: "server-admin"
    whois-line: "is the server administrator"
    # certfp: set via env
    auto: true

  eleonora:
    class: "server-admin"
    whois: "is the server owner"
    # certfp: set via env
    auto: true

logging:
  - method: stderr
    type: "* -userinput -useroutput"
    level: info

debug:
  recover-from-errors: false

lock-file: "/data/ergo.lock"

datastore:
  path: "/data/ergo.db"
  autoupgrade: true

  postgresql:
    enabled: true
    host: "postgres"
    ssl-mode: "disable"
    user: "ergo"
    # password: set via env
    history-database: "ergo"
    timeout: 3s
    max-conns: 4

languages:
  enabled: false

limits:
  nicklen: 32
  identlen: 20
  realnamelen: 150
  channellen: 64
  awaylen: 390
  kicklen: 390
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-modes: 100
  registration-messages: 1024
  multiline:
    max-bytes: 4096
    max-lines: 100

fakelag:
  enabled: true
  window: 1s
  burst-limit: 5
  messages-per-window: 2
  cooldown: 2s

  command-budgets:
    "CHATHISTORY": 16
    "MARKREAD": 16
    "MONITOR": 1
    "WHO": 4
    "WEBPUSH": 1

roleplay:
  enabled: true
  require-oper: false
  require-chanops: false
  add-suffix: true

history:
  enabled: true

  autoreplay-on-join: 20
  chathistory-maxmessages: 1000
  znc-maxmessages: 2048

  restrictions:
    query-cutoff: "none"

  persistent:
    enabled: true
    unregistered-channels: false
    registered-channels: "opt-out"
    direct-messages: "opt-out"

  retention:
    allow-individual-delete: false
    enable-account-indexing: false

  tagmsg-storage:
    default: false
    whitelist:
      - "+draft/react"
      - "+react"

allow-environment-overrides: true

metadata:
  enabled: true
  operator-only-modification: false
  max-subs: 100
  max-keys: 100

  client-throttle:
    enabled: true
    duration: 2m
    max-attempts: 10
