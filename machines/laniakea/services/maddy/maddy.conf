state_dir /data

auth.pass_table local_authdb {
	table sql_table {
		driver sqlite3
		dsn credentials.db
		table_name passwords
	}
}

storage.imapsql local_mailboxes {
	driver sqlite3
	dsn imap.db
	msg_store fs imap
	appendlimit 100M
}

imap tcp://0.0.0.0:1143 {
	tls off
	auth &local_authdb
	storage &local_mailboxes
}
