debug {
	disable_logs = false
	enable_stdout_logs = true
}

input {
	kb_layout = de
	kb_options = compose:sclk
	repeat_rate = 50
	repeat_delay = 300
}

general {
	gaps_in = 5
	gaps_out = 5
	border_size = 2
	col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)

	layout = dwindle
}

cursor {
	inactive_timeout = 3
	persistent_warps = true
}

decoration {
	blur {
		enabled = true
		size = 3
		passes = 1
		new_optimizations = true
	}

	rounding = 10
}

animations {
	enabled = yes

	bezier = myBezier, 0.05, 0.9, 0.1, 1.05

	animation = windows, 1, 7, myBezier
	animation = windowsOut, 1, 7, default, popin 80%
	animation = border, 1, 10, default
	animation = borderangle, 1, 8, default
	animation = fade, 1, 7, default
	animation = workspaces, 1, 6, default

	animation = hyprfocusIn, 1, 1, default
}

dwindle {
	pseudotile = yes
	preserve_split = yes
	force_split = 2
}

misc {
	disable_hyprland_logo = true

	mouse_move_enables_dpms = true
	key_press_enables_dpms = true

	# swallowing doesn't work in tmux, but that's fine
	enable_swallow = true
	swallow_regex = foot

	# unmax current fullscreen window if another window opens
	on_focus_under_fullscreen = 2

	enable_anr_dialog = false

	disable_xdg_env_checks = true
}

plugin {
	dynamic-cursors {
		enabled = true
		mode = stretch
		shake {
			enabled = true
		}
	}

	hyprfocus {
		mode = slide
		only_on_monitor_change = true
	}
}

ecosystem {
	no_update_news = true
	no_donation_nag = true
}

binds {
	workspace_back_and_forth = true
}

# https://wiki.hyprland.org/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

windowrule = match:class ^dropdown_.*, float 1, dim_around 1

# programs
bind = $mod,       Return, exec, @terminal@
bind = $mod SHIFT, Return, exec, foot

bind = $mod SHIFT, a, exec, @dropdown@ @pulsemixer@
bind = $mod SHIFT, e, exec, emacsclient -e '(save-buffers-kill-emacs)'
bind = $mod,       a, exec, @dropdown@ @qalc@
bind = $mod,       c, exec, [workspace 3 silent] uwsm app vesktop
bind = $mod,       d, exec, @fuzzel@
bind = $mod,       e, exec, emacsclient -nce '(my/greeter)'
bind = $mod,       i, exec, foot htop
bind = $mod,       m, exec, foot ncmpcpp
bind = $mod,       n, exec, foot bash -c 'sleep 0.1; nmtui'
bind = $mod,       p, exec, @dropdown@ @ipython@
bind = $mod,       w, exec, uwsm app librewolf
bind = $mod,       x, exec, loginctl lock-session

# special
bind = $mod,       Backspace, exec, @prompt@ "Shutdown?" poweroff
bind = $mod SHIFT, Backspace, exec, @prompt@ "Reboot?"   reboot
bind = $mod CTRL,  Backspace, exec, @prompt@ "Suspend?"  systemctl suspend
bind = $mod,       Escape,    exec, @prompt@ "Logout?"   hyprctl dispatch exit
bind = $mod CTRL,  i,         exec, @idle-toggle@

bind = , Print, exec, flameshot-run

windowrule {
	name = fix flameshot
	match:title = flameshot

	stay_focused = 1
	border_size = 0
	rounding = 0
	move = 0 0
	float = 1
	pin = 1
}

# zoom
bind = $mod, plus,       exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.25}')"
bind = $mod, minus,      exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.25}')"
bind = $mod, numbersign, exec, hyprctl keyword cursor:zoom_factor 1

# media keys
bind = , XF86AudioLowerVolume,  exec, @audio-helper@ change -10
bind = , XF86AudioRaiseVolume,  exec, @audio-helper@ change +10
bind = , XF86AudioMute,         exec, @audio-helper@ mute
bind = , XF86AudioMicMute,      exec, @audio-helper@ micmute
bind = , XF86AudioPlay,         exec, @audio-helper@ play
bind = , XF86AudioPrev,         exec, @audio-helper@ prev
bind = , XF86AudioNext,         exec, @audio-helper@ next
bind = , XF86MonBrightnessUp,   exec, @brightness-helper@ +10
bind = , XF86MonBrightnessDown, exec, @brightness-helper@ -10

# WM
bind = $mod,       f, fullscreenstate, 1 0 # keep margins; don't tell client
bind = $mod SHIFT, f, togglefloating
bind = $mod CTRL,  f, fullscreenstate, 2 2 # true fullscreen; tell client
bind = $mod,       h, movetoworkspace, special
bind = $mod SHIFT, h, togglespecialworkspace
bind = $mod,       q, exec, @safekill@

bind = $mod, Tab, workspace, previous

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up,    swapwindow, u
bind = $mod SHIFT, down,  swapwindow, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
